name: Pinned Windows EXL3 runtime compilation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/build_upstream.py
      - requirements-exllama-windows.lock
      - provenance/sources.lock.json
      - provenance/cuda-sdk-windows.lock.json
      - tools/prepare_cuda_sdk.py
      - .github/workflows/windows-exllama.yml

permissions:
  contents: read

concurrency:
  group: windows-exllama-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      MAX_JOBS: "2"
      TORCH_CUDA_ARCH_LIST: "8.9;12.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-exllama-windows.lock
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
      - name: Install the hash-pinned EXLlama and build dependencies
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          --index-url https://pypi.org/simple
          --extra-index-url https://download.pytorch.org/whl/cu130
          -r requirements-dev.lock -r requirements-exllama-windows.lock
      - name: Install the verified official compiler SDK
        run: python tools/prepare_cuda_sdk.py --destination "$env:RUNNER_TEMP/cuda-13.2"
      - name: Compile the pinned upstream source for both GPU architectures
        run: >-
          python tools/build_upstream.py --sdk "$env:RUNNER_TEMP/cuda-13.2"
          --work "$env:RUNNER_TEMP/exllama-source"
          --output "$env:RUNNER_TEMP/exllama-evidence"
      - name: Retain exact source and native build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-exllama-${{ github.sha }}
          path: ${{ runner.temp }}/exllama-evidence
          retention-days: 7
