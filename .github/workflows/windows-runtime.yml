name: Complete isolated Windows runtime bundle

on:
  workflow_dispatch:
    inputs:
      vllm_run:
        description: Successful owned-profile native vLLM run
        required: true
      exllama_run:
        description: Successful native EXLlama run
        default: '39345608258'
        required: true
      native_run:
        description: Successful project ABI-2 native run with matching native source
        default: '39350431617'
        required: true

permissions:
  contents: read
  actions: read

jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
      - name: Install hash-pinned Python packaging tools
        run: python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.lock
      - name: Fetch successful native component wheels and their exact build reports
        env:
          VLLM_RUN: ${{ inputs.vllm_run }}
          EXLLAMA_RUN: ${{ inputs.exllama_run }}
          NATIVE_RUN: ${{ inputs.native_run }}
        run: >-
          python tools/fetch_runtime_components.py
          --vllm-run "$env:VLLM_RUN" --exllama-run "$env:EXLLAMA_RUN" --native-run "$env:NATIVE_RUN"
          --output "$env:RUNNER_TEMP/runtime-components"
      - name: Assemble the real five-wheel application and app-local runtime bundle
        run: >-
          python tools/build_bundle.py
          --vllm "$env:RUNNER_TEMP/runtime-components/vllm"
          --exllama "$env:RUNNER_TEMP/runtime-components/exllama"
          --native "$env:RUNNER_TEMP/runtime-components/native"
          --work "$env:RUNNER_TEMP/runtime-assembly"
          --output "$env:RUNNER_TEMP/DeepSeekRPC"
      - name: Install and qualify complete dependencies, actual native exports and parser without the SDK
        shell: powershell
        run: '& "$env:RUNNER_TEMP/DeepSeekRPC/Install.ps1" -BundleRoot "$env:RUNNER_TEMP/DeepSeekRPC"'
      - name: Seal actual installed qualification into the distributable manifest
        run: python tools/finalize_bundle.py --bundle "$env:RUNNER_TEMP/DeepSeekRPC"
      - name: Retain complete application installer and precise qualification evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-runtime-${{ github.sha }}
          path: |
            ${{ runner.temp }}/DeepSeekRPC/BUNDLE.json
            ${{ runner.temp }}/DeepSeekRPC/Install.ps1
            ${{ runner.temp }}/DeepSeekRPC/requirements-runtime-windows.lock
            ${{ runner.temp }}/DeepSeekRPC/wheels.lock
            ${{ runner.temp }}/DeepSeekRPC/wheels
            ${{ runner.temp }}/DeepSeekRPC/crt
            ${{ runner.temp }}/DeepSeekRPC/config
            ${{ runner.temp }}/DeepSeekRPC/launchers
            ${{ runner.temp }}/DeepSeekRPC/docs
            ${{ runner.temp }}/DeepSeekRPC/provenance
            ${{ runner.temp }}/DeepSeekRPC/tools
            ${{ runner.temp }}/DeepSeekRPC/tests/fixtures/tokenizer.json.gz
            ${{ runner.temp }}/DeepSeekRPC/LICENSE
            ${{ runner.temp }}/DeepSeekRPC/THIRD_PARTY_NOTICES.md
            ${{ runner.temp }}/DeepSeekRPC/SOURCE.md
            ${{ runner.temp }}/DeepSeekRPC/patches
            ${{ runner.temp }}/DeepSeekRPC/evidence
          retention-days: 7
      - name: Retain bounded failed installation diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-runtime-failure-${{ github.sha }}
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/DeepSeekRPC/.installation-check/*.json
            ${{ runner.temp }}/DeepSeekRPC/BUNDLE.json
            ${{ runner.temp }}/runtime-components/RUNS.json
          retention-days: 7
