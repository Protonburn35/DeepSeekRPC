name: Pinned Windows vLLM native compilation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .gitattributes
      - tools/build_upstream.py
      - tools/patch_vllm_for_rpc.py
      - patches/**
      - requirements-vllm-build-windows.lock
      - provenance/sources.lock.json
      - provenance/cuda-sdk-windows.lock.json
      - provenance/vllm-native-deps.lock.json
      - .github/workflows/windows-vllm.yml

permissions:
  contents: read

concurrency:
  group: windows-vllm-${{ github.ref }}
  # Native compilation takes several hours. A new reference/provenance commit
  # must not discard a valid build in progress; queued redundant runs can be
  # cancelled after comparing their exact source and five-patch identities.
  cancel-in-progress: false

jobs:
  compile:
    runs-on: windows-2025
    # The pinned core, MoE and FlashAttention SM89/SM120 targets reached
    # 163/189 at the previous three-hour limit. Preserve the complete profile
    # and give its actual MSVC/nvcc build enough time to finish and qualify.
    timeout-minutes: 360
    env:
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      MAX_JOBS: "2"
      TORCH_CUDA_ARCH_LIST: "8.9;12.0"
      # CMake fetches upstream submodules containing paths longer than 260.
      # Apply this to this job's Git processes; do not alter global Git config.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-vllm-build-windows.lock
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
      - name: Install hash-pinned native build dependencies
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          --index-url https://pypi.org/simple
          --extra-index-url https://download.pytorch.org/whl/cu130
          -r requirements-vllm-build-windows.lock
      - name: Install the verified official compiler SDK
        run: python tools/prepare_cuda_sdk.py --destination "$env:RUNNER_TEMP/cuda-13.2"
      - name: Build the exact vLLM Windows source and inspect the installed native module
        run: >-
          python tools/build_upstream.py --component vllm-windows
          --sdk "$env:RUNNER_TEMP/cuda-13.2"
          --work "$env:RUNNER_TEMP/vllm-source"
          --output "$env:RUNNER_TEMP/vllm-evidence"
      - name: Retain exact source and native build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-vllm-${{ github.sha }}
          path: ${{ runner.temp }}/vllm-evidence
          retention-days: 7
