name: CPU foundation and native Windows checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    name: ${{ matrix.os }} / Python 3.12 / CPU only
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            reference: linux
          - os: windows-2025
            reference: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install hash-pinned CPU test and mathematical reference tools
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          --index-url https://pypi.org/simple
          --extra-index-url https://download.pytorch.org/whl/cpu
          -r requirements-dev.lock -r requirements-reference-${{ matrix.reference }}.lock
      - name: Run tests, build wheel, and check installed package outside the checkout
        run: python tools/ci_check.py
      - name: Retain exact-source CPU results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cpu-foundation-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/deepseekrpc-check
          retention-days: 7
