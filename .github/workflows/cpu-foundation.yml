name: Native Windows CPU checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  foundation:
    name: Windows 2025 / Python 3.12 / CPU only
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install hash-pinned CPU test and mathematical reference tools
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          --index-url https://pypi.org/simple
          --extra-index-url https://download.pytorch.org/whl/cpu
          -r requirements-dev.lock -r requirements-reference-windows.lock
      - name: Run tests, build wheel, and check installed package outside the checkout
        run: python tools/ci_check.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Install integrity-locked actual OpenCode-compatible SDK without package scripts
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix tools/client-audit
      - name: Audit actual SDK wire, stream/tool/reasoning preservation and cancellation
        run: >-
          node tools/audit_opencode_client.mjs --modules tools/client-audit/node_modules
          --output "$env:RUNNER_TEMP/deepseekrpc-check/client"
      - name: Prepare actual SDK text/image/tool requests with the original tokenizer/template
        env:
          PYTHONPATH: src
        run: python tools/audit_client_requests.py --input "$env:RUNNER_TEMP/deepseekrpc-check/client"
      - name: Retain exact-source CPU results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cpu-foundation-windows-2025-${{ github.sha }}
          path: ${{ runner.temp }}/deepseekrpc-check
          retention-days: 7
