name: Native Windows CUDA compilation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - native/**
      - tools/build_native.py
      - tools/prepare_cuda_sdk.py
      - provenance/cuda-sdk-windows.lock.json
      - requirements-cuda-windows.lock
      - requirements-dev.lock
      - .github/workflows/windows-cuda.yml

permissions:
  contents: read

concurrency:
  group: windows-cuda-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      MAX_JOBS: "2"
      TORCH_CUDA_ARCH_LIST: "8.9;12.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-cuda-windows.lock
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
      - name: Install hash-pinned Windows CUDA Torch and build tools
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          --index-url https://pypi.org/simple
          --extra-index-url https://download.pytorch.org/whl/cu130
          -r requirements-dev.lock -r requirements-cuda-windows.lock
      - name: Install the verified official compiler SDK into runner temporary storage
        run: python tools/prepare_cuda_sdk.py --destination "$env:RUNNER_TEMP/cuda-13.2"
      - name: Compile SM89 and SM120, link, import without a GPU, inspect both cubins
        run: >-
          python tools/build_native.py --sdk "$env:RUNNER_TEMP/cuda-13.2"
          --output "$env:RUNNER_TEMP/deepseekrpc-cuda-build"
      - name: Run CPU fixtures against the actual Windows CUDA Torch stack
        run: python -m pytest -q --junitxml="$env:RUNNER_TEMP/deepseekrpc-cuda-build/stack-tests.xml"
      - name: Retain source-specific native build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-cuda-${{ github.sha }}
          path: ${{ runner.temp }}/deepseekrpc-cuda-build
          retention-days: 7
