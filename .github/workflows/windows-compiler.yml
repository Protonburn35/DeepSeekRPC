name: Isolated Windows runtime compiler checks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/deepseekrpc/triton_policy.py
      - src/deepseekrpc/compiler_selftest.py
      - src/deepseekrpc/_triton_compile_probe.py
      - src/deepseekrpc/_vendor/vllm_windows/TRITON.json
      - tools/check_windows_compiler.py
      - src/deepseekrpc/local_groups.py
      - tools/qualify_runtime.py
      - requirements-runtime-windows.lock
      - packaging/Install.ps1
      - provenance/windows-bootstrap.lock.json
      - provenance/python-windows-download.json
      - .github/workflows/windows-compiler.yml

permissions:
  contents: read

concurrency:
  group: windows-runtime-compiler-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compiler:
    runs-on: windows-2025
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install hash-pinned packaging tools
        run: >-
          python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.lock
      - name: Qualify actual private compilers, pinned external dependencies and CUDA-Torch CPU startup
        run: python tools/check_windows_compiler.py
      - name: Retain bounded actual compiler evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-runtime-compiler-${{ github.sha }}
          path: |
            ${{ runner.temp }}/deepseekrpc-compiler-check/BUILD.json
            ${{ runner.temp }}/deepseekrpc-compiler-check/compilers.json
            ${{ runner.temp }}/deepseekrpc-compiler-check/external-runtime.json
            ${{ runner.temp }}/deepseekrpc-compiler-check/*.log
            ${{ runner.temp }}/deepseekrpc-bootstrap-check/BUILD.json
            ${{ runner.temp }}/deepseekrpc-bootstrap-check/bootstrap-*.log
          retention-days: 7
