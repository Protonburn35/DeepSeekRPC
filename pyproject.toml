[build-system]
requires = ["setuptools==80.10.2", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deepseekrpc"
version = "0.0.1.dev2"
description = "Three-stage native Windows DeepSeek EXL3 runtime development"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "src/deepseekrpc/_vendor/deepseek_1017/LICENSE", "src/deepseekrpc/_vendor/vllm_windows/LICENSE"]
dependencies = ["numpy==2.3.5", "safetensors==0.8.0", "tokenizers==0.23.3", "huggingface-hub==1.33.0", "pillow==13.0.0"]

[project.optional-dependencies]
api = ["fastapi==0.136.3", "uvicorn==0.54.0"]
test = ["pytest==9.1.1", "pyflakes==3.4.0", "cryptography==49.0.0", "pip==26.2.1", "build==1.6.1", "cmake==4.4.4", "ninja==1.13.2", "setuptools==80.10.2", "wheel==0.48.0", "fastapi==0.136.3", "uvicorn==0.54.0", "httpx==0.28.1"]

[project.scripts]
deepseekrpc = "deepseekrpc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"deepseekrpc._vendor.deepseek_1017" = ["LICENSE", "PROVENANCE.json"]
"deepseekrpc._vendor.vllm_windows" = ["LICENSE", "PROVENANCE.json", "RUNTIME.json", "DEPLOYMENT.json", "TRITON.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = ["integration: real subprocess and TCP integration checks", "reference: requires separately pinned CPU PyTorch reference tools"]
